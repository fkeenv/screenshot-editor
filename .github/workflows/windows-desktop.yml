name: Windows desktop

on:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:make
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-editor-windows
          path: out/make/**/*
